name: Pack and publish NuGet package

on:
  push:
    branches:
      - master
    tags:
      - 'nuget/v*'
    paths:
      - 'packaging/PSScriptAnalyzer.Package/**'
      - 'Engine/**'
      - 'Rules/**'
      - 'PSCompatibilityCollector/**'
      - 'build.ps1'
      - 'build.psm1'
      - '.github/workflows/nuget-package.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_SOURCE: https://nuget.pkg.github.com/immense/index.json
  PACKAGE_PROJECT: packaging/PSScriptAnalyzer.Package/PSScriptAnalyzer.Package.csproj

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.403

      - name: Install PlatyPS
        shell: pwsh
        run: Install-Module PlatyPS -Scope CurrentUser -Force -Repository PSGallery

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          [xml]$xml = Get-Content Engine/Engine.csproj
          $sourceVersion = $xml.Project.PropertyGroup.VersionPrefix
          if ("${{ github.ref }}" -like 'refs/tags/nuget/v*') {
            $packageVersion = "${{ github.ref_name }}".Substring(7)
          }
          else {
            $packageVersion = "$sourceVersion-preview.${{ github.run_number }}"
          }
          "packageVersion=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Build PowerShell 7 module output
        shell: pwsh
        run: ./build.ps1 -Configuration Release -PSVersion 7

      - name: Pack package
        run: dotnet pack ${{ env.PACKAGE_PROJECT }} -c Release -p:PackageVersion=${{ steps.version.outputs.packageVersion }} -o ./nupkgs

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkgs/*.nupkg --source ${{ env.NUGET_SOURCE }} --api-key ${{ github.token }} --skip-duplicate
